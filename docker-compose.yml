services:
  postgres:
    image: postgres:17-alpine
    container_name: sigaa-lite-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sigaa
      POSTGRES_PASSWORD: sigaa
      POSTGRES_DB: sigaa
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Cria também o banco isolado usado pelos testes de integração
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sigaa -d sigaa']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
